name: Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, test and publish MT_PING
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          add-job-summary: 'on-failure'

      - name: Check Android SDK preinstalled on GitHub hosted runner
        shell: bash
        run: |
          set -euxo pipefail
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -f "$ANDROID_HOME/build-tools/35.0.0/aapt2"
          echo "Android 35 SDK already available"

      - name: Print build environment
        shell: bash
        run: |
          set -euxo pipefail
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la app/src/main/java/online/mtradius/mtping/

      - name: Compile Android and run JVM tests
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest

      - name: Check and name output
        shell: bash
        run: |
          set -euxo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk MT_TOOLS.apk
          ls -lh MT_TOOLS.apk
          sha256sum MT_TOOLS.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MT_TOOLS-APK
          path: MT_TOOLS.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish MT_PING release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: MT_PING v2.0.0
          target_commitish: ${{ github.sha }}
          body: |
            **MT_TOOLS v2.0.0 • أدوات صيانة الشبكات**

            - تغيير اسم التطبيق إلى MT_TOOLS مع الاحتفاظ بمعرف الحزمة لترقية التطبيق السابق.
            - كتابة فاصل Ping يدوي بالمللي ثانية: من 200 إلى 60000، الافتراضي 1000.
            - Traceroute مع تدرج TTL على الأجهزة الداعمة.
            - IP داخلي وخارجي وGateway مع فتح صفحة الراوتر HTTP.
            - فحص LAN بنطاق محدد وآمن على شبكة Wi-Fi.
            - Ubiquiti Discovery عبر UDP/10001 وقراءة الموديل وMAC وFirmware وUptime عند توفرها.
            - حذف العنوان الفرعي للرسم البياني.
            - عدادا الإشعارات يستخدمان وقت بداية موحّداً ولا يعاد تحديثهما كل نبضة.
            - لا يظهر نص قديم لمدة الفصل أثناء العد؛ العداد الأصلي من النظام هو مصدر الوقت.
            - سجل الفصل خاص بجلسة المراقبة الحالية ويُمسح عند إيقافها أو بدء جلسة جديدة.
            - إزالة أزرار تصدير CSV وحفظ CSV القديم.
            - حذف العبارة الثانوية من ترويسة التطبيق.
            - إصلاح تداخل الترويسة مع شريط الساعة والإشعارات على Android 15+.
            - ترتيب الاسم وحالة الاتصال مع هامش آمن وواجهة RTL.
            - إشعار تنبيه عند بدء كل انقطاع.
            - عدّاد الفصل يتجدد كل ثانية بلوحة الإشعارات.
            - عرض مدة آخر فصل بعد عودة الاتصال.
            - حفظ جميع مرات الفصل في SQLite مع التاريخ والمدة والحالة.
            - تصدير سجل الانقطاعات كاملاً إلى CSV.
            - مراقبة ICMP بالخلفية باستخدام Foreground Service.
            - عناوين جاهزة: 10.0.0.1 و 8.8.8.8 و www.google.com.

            APK موقّع بتوقيع اختبار آلي، مناسب للتثبيت المباشر وليس إصدار Play Store.
          files: MT_TOOLS.apk
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
