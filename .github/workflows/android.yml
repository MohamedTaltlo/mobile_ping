name: Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, test and publish MT_TOOLS
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          add-job-summary: 'on-failure'

      - name: Check Android SDK preinstalled on GitHub hosted runner
        shell: bash
        run: |
          set -euxo pipefail
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -f "$ANDROID_HOME/build-tools/35.0.0/aapt2"
          echo "Android 35 SDK already available"

      - name: Print build environment
        shell: bash
        run: |
          set -euxo pipefail
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la app/src/main/java/online/mtradius/mtping/

      - name: Stage optional Android Nmap executable
        shell: bash
        run: |
          set -euo pipefail
          # Upstream Android Nmap 7.31. Staging is optional, never a build blocker.
          mkdir -p /tmp/mt-nmap
          if curl --fail --location --retry 2 --max-time 100 -o /tmp/mt-nmap.zip https://github.com/kost/nmap-android/releases/download/v7.31/nmap-7.31-binaries-arm64-v8a.zip; then
            unzip -q /tmp/mt-nmap.zip -d /tmp/mt-nmap
            echo "Nmap archive contents:"
            find /tmp/mt-nmap -type f | head -40
            BIN="$(find /tmp/mt-nmap -type f | grep -E '/(nmap|libnmap[.]so)$' | head -1 || true)"
            if [ -n "$BIN" ]; then
              mkdir -p app/src/main/jniLibs/arm64-v8a
              cp "$BIN" app/src/main/jniLibs/arm64-v8a/libnmap.so
              chmod 755 app/src/main/jniLibs/arm64-v8a/libnmap.so
              file app/src/main/jniLibs/arm64-v8a/libnmap.so
              echo "Nmap native executable staged"
            else
              echo "No compatible executable found: TCP fallback will be used"
            fi
          else
            echo "Nmap package download unavailable: TCP fallback will be used"
          fi

      - name: Compile Android and run JVM tests
        shell: bash
        env:
          MT_TOOLS_KEYSTORE_BASE64: ${{ secrets.MT_TOOLS_KEYSTORE_BASE64 }}
          MT_TOOLS_KEYSTORE_PASSWORD: ${{ secrets.MT_TOOLS_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$MT_TOOLS_KEYSTORE_BASE64" ] && [ -n "$MT_TOOLS_KEYSTORE_PASSWORD" ]; then
            echo "PERMANENT APK SIGNING: enabled (keystore from protected Actions secrets)"
          else
            echo "::warning::Permanent Android signing secrets NOT configured. Debug-signed APK requires uninstall when its certificate changes. Run scripts/setup-stable-signing.sh and configure Actions secrets."
          fi
          gradle --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest

      - name: Check and name output
        shell: bash
        run: |
          set -euxo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk MT_TOOLS.apk
          ls -lh MT_TOOLS.apk
          sha256sum MT_TOOLS.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs MT_TOOLS.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MT_TOOLS-APK
          path: MT_TOOLS.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish MT_TOOLS release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.0
          name: MT_TOOLS v3.0.0
          target_commitish: ${{ github.sha }}
          body: |
            **MT_TOOLS v3.0.0 — تحسين RTL وتحليل 5 GHz**

            - ضبط القيم الرقمية وعلامات الوحدات وسط الأسطر العربية.
            - التحليل يعتمد القنوات الأربع الأكثر توافقاً في نطاق 5 GHz: 36، 40، 44، 48.
            - إظهار ثلاثة أسطر مختصرة لعدد الشبكات والقناة الحالية والتوصية.
            - عندما يكون أداء القناة الحالية مماثلاً أو أفضل، يعرض «التردد الحالي لا يحتاج إلى تغيير».
            - مراعاة عرض قناة 80 MHz: لا يقترح تغييراً شكلياً ضمن نفس كتلة التردد.
            - إضافة آلية توقيع Android دائمة من GitHub Actions Secrets، لحل الحاجة لحذف التطبيق عند التحديث بعد ضبط السرَّين.
            - سكربت إعداد محلي لمفتاح التوقيع: scripts/setup-stable-signing.sh.
            - لا ترفع مفتاح التوقيع السري إلى المستودع العام.
            - الإصدار المبني من دون الأسرار سيظل بتوقيع Debug متغيّر، ولا يمكنه تحديث نسخة سابقة بتوقيع مختلف.
          files: MT_TOOLS.apk
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
