name: Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, test and publish MT_TOOLS
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          add-job-summary: 'on-failure'

      - name: Check Android SDK preinstalled on GitHub hosted runner
        shell: bash
        run: |
          set -euxo pipefail
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -f "$ANDROID_HOME/build-tools/35.0.0/aapt2"
          echo "Android 35 SDK already available"

      - name: Print build environment
        shell: bash
        run: |
          set -euxo pipefail
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la app/src/main/java/online/mtradius/mtping/

      - name: Compile Android and run JVM tests
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest

      - name: Check and name output
        shell: bash
        run: |
          set -euxo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk MT_TOOLS.apk
          ls -lh MT_TOOLS.apk
          sha256sum MT_TOOLS.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MT_TOOLS-APK
          path: MT_TOOLS.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish MT_TOOLS release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.1
          name: MT_TOOLS v2.1.1
          target_commitish: ${{ github.sha }}
          body: |
            **MT_TOOLS v2.1.1 — إصلاحات فني الصيانة**

            - القائمة الجانبية تفتح من اليسار بجانب زر القائمة.
            - إيقاف فحص LAN أثناء التشغيل مع الحفاظ على النتائج المكتشفة.
            - المحافظة على اسم الراوتر ومعلومات UPnP المكتشفة وعدم استبدالها بتصنيف عام.
            - سطر الماك يظهر فقط عندما يُكتشف؛ تسمية الماك بالعربية.
            - فحص جميع منافذ TCP من 1 إلى 65535 مع مؤشر تقدم وزر إيقاف.
            - تصحيح جميع تسميات «جاري» إلى «جار» في الواجهة.
            - فوتر في جميع الصفحات: Developed by: MT_RADIUS 2019-السنة الحالية، مع رابط واتساب.
            - معالجة اهتزاز موضع الشاشة عند Done بلوحة الأرقام، وضبط منطقة شريط الحالة.
            - استمرار مراقبة Ping وسجل الانقطاعات وUBNT Discovery دون تغيير.

            تنبيه: أداة اكتشاف الأجهزة تعرض فقط البيانات التي تقدمها الشبكة والأنظمة فعلياً.
                    files: MT_TOOLS.apk
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
