name: Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build and unit-test
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Prepare installable APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MT_PING.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MT_PING-Android-APK
          path: MT_PING.apk
      - name: Publish download release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v1.0.0"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" MT_PING.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" MT_PING.apk --repo "$GITHUB_REPOSITORY" \
              --title "MT_PING v1.0.0" \
              --notes "Android 8.0+ / debug-signed APK for sideloading. Background ICMP service, packet history, live outage timer and CSV export."
          fi
