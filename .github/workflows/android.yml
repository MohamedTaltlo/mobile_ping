name: Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, test and publish MT_PING
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          add-job-summary: 'on-failure'

      - name: Check Android SDK preinstalled on GitHub hosted runner
        shell: bash
        run: |
          set -euxo pipefail
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -f "$ANDROID_HOME/build-tools/35.0.0/aapt2"
          echo "Android 35 SDK already available"

      - name: Print build environment
        shell: bash
        run: |
          set -euxo pipefail
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la app/src/main/java/online/mtradius/mtping/

      - name: Compile Android and run JVM tests
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest

      - name: Check and name output
        shell: bash
        run: |
          set -euxo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk MT_PING.apk
          ls -lh MT_PING.apk
          sha256sum MT_PING.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MT_PING-APK
          path: MT_PING.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish MT_PING release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.1
          name: MT_PING v1.1.1
          target_commitish: ${{ github.sha }}
          body: |
            **MT_PING 1.1.1 • إصلاح الترويسة وشريط الحالة**

            - إصلاح تداخل الترويسة مع شريط الساعة والإشعارات على Android 15+.
            - ترتيب الاسم وحالة الاتصال مع هامش آمن وواجهة RTL.
            - إشعار تنبيه عند بدء كل انقطاع.
            - عدّاد الفصل يتجدد كل ثانية بلوحة الإشعارات.
            - عرض مدة آخر فصل بعد عودة الاتصال.
            - حفظ جميع مرات الفصل في SQLite مع التاريخ والمدة والحالة.
            - تصدير سجل الانقطاعات كاملاً إلى CSV.
            - مراقبة ICMP بالخلفية باستخدام Foreground Service.
            - عناوين جاهزة: 10.0.0.1 و 8.8.8.8 و www.google.com.

            APK موقّع بتوقيع اختبار آلي، مناسب للتثبيت المباشر وليس إصدار Play Store.
          files: MT_PING.apk
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
